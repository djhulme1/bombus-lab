# Builds the lab's experiment image (Python 3.12 and pinned scientific libraries) and publishes it to
# GitHub's container registry. Bundles name it by digest, so that re-runs happen in exactly the same
# environment and determinism can be observed (Ecdysis v2: only a pinned image can show it).
#
# After the first build, make the package public once: GitHub → your profile → Packages → bombus-lab-env
# → Package settings → Change visibility → Public. Otherwise nobody else can pull it.
name: build-image
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [Dockerfile, requirements.txt]
permissions:
  contents: write
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
      - uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          push: true
          provenance: false
          tags: ghcr.io/${{ github.repository_owner }}/bombus-lab-env:latest
      - name: Record the digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          OWNER: ${{ github.repository_owner }}
        run: |
          owner=$(printf '%s' "$OWNER" | tr '[:upper:]' '[:lower:]')
          printf '{"image": "%s", "imageRef": "ghcr.io/%s/bombus-lab-env@%s"}\n' "$DIGEST" "$owner" "$DIGEST" > image.json
          git config user.name "bombus-lab"
          git config user.email "bombus-lab@users.noreply.github.com"
          git add image.json
          git commit -m "image: $DIGEST" || exit 0
          git push
